<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="linenTitle linenDesc">
  <title id="linenTitle">Tactile material study</title>
  <desc id="linenDesc">An original illustrative weave of ivory, sage, and warm gold. Not client photography.</desc>
  <defs>
    <pattern id="weave" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#E8E4D6"/>
      <path d="M0 9 H18 M9 0 V18" stroke="#A7B6AC" stroke-opacity="0.28" stroke-width="1"/>
    </pattern>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3F0E7"/>
      <stop offset="1" stop-color="#C9D0C8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#shade)"/>
  <rect x="70" y="70" width="1060" height="760" fill="url(#weave)" rx="18"/>
  <rect x="160" y="160" width="520" height="580" fill="#121A17" opacity="0.08" rx="12"/>
  <rect x="430" y="210" width="560" height="420" fill="#102E25" opacity="0.18" rx="12"/>
  <rect x="520" y="280" width="380" height="280" fill="none" stroke="#C7A45A" stroke-width="2" rx="10"/>
  <path d="M200 700 C360 560 520 620 680 520 C840 420 980 500 1080 430" fill="none" stroke="#0B4635" stroke-opacity="0.35" stroke-width="8"/>
  <circle cx="900" cy="330" r="46" fill="#C7A45A" fill-opacity="0.35"/>
</svg>
